<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Инвестиционный проект: Мельбурн</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }

    .fade-in {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.65s ease, transform 0.65s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #e2e8f0;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #10b981;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    input[type=range]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #10b981;
      cursor: pointer;
      border: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.38s ease;
    }
    .accordion-content.open {
      max-height: 600px;
    }

    .accordion-icon {
      transition: transform 0.3s ease;
    }
    .accordion-icon.rotated {
      transform: rotate(180deg);
    }
  </style>
</head>
<body class="font-sans bg-white text-slate-800 antialiased">

<!-- ══════════════════════════════════════════
     PASSWORD OVERLAY
══════════════════════════════════════════ -->
<div id="pwd-overlay" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm text-center">
    <div class="flex justify-center mb-5">
      <div class="w-16 h-16 rounded-full bg-emerald-50 flex items-center justify-center">
        <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
    </div>
    <h2 id="pwd-title" data-i18n="pwd-title" class="text-xl font-bold text-slate-900 mb-1"></h2>
    <p id="pwd-subtitle" data-i18n="pwd-subtitle" class="text-slate-400 text-sm mb-6"></p>
    <input id="pwd-input" type="password" placeholder="••••••••••••"
      class="w-full border border-slate-200 rounded-xl px-4 py-3 text-center text-slate-900 text-lg tracking-widest
             focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent mb-3 transition">
    <div id="pwd-error" data-i18n="pwd-error" class="text-red-500 text-sm mb-3 hidden"></div>
    <button onclick="checkPassword()"
      class="w-full bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-semibold py-3 rounded-xl
             transition-colors shadow-sm">
      <span id="pwd-btn-text" data-i18n="pwd-btn-text"></span>
    </button>
  </div>
</div>

<!-- ══════════════════════════════════════════
     LANGUAGE TOGGLE (fixed)
══════════════════════════════════════════ -->
<div class="fixed top-4 right-4 z-[60] flex bg-white/95 backdrop-blur rounded-full shadow-lg border border-slate-100 p-1 gap-1">
  <button id="btn-ru" onclick="setLang('ru')"
    class="px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-emerald-500 text-white">
    РУ
  </button>
  <button id="btn-en" onclick="setLang('en')"
    class="px-3 py-1.5 rounded-full text-sm font-bold transition-all text-slate-500 hover:text-slate-800">
    EN
  </button>
</div>

<!-- ══════════════════════════════════════════
     MAIN CONTENT
══════════════════════════════════════════ -->
<main id="main" class="hidden">

  <!-- ── SECTION 1: HERO ────────────────── -->
  <section id="hero" class="bg-slate-900 text-white py-24 px-4 md:px-8 lg:px-12">
    <div class="max-w-4xl mx-auto fade-in">
      <div class="inline-flex items-center gap-2 bg-emerald-500/15 border border-emerald-500/25 text-emerald-400
                  text-xs font-semibold px-4 py-1.5 rounded-full mb-8 uppercase tracking-wider">
        <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse inline-block"></span>
        <span data-i18n="hero-badge"></span>
      </div>
      <h1 data-i18n="hero-title"
        class="text-3xl md:text-5xl font-extrabold mb-8 leading-tight tracking-tight"></h1>
      <div data-i18n="hero-body"
        class="text-slate-300 text-base md:text-lg leading-relaxed space-y-5 max-w-3xl"></div>
    </div>
  </section>

  <!-- ── SECTION 2: SUBURBS ─────────────── -->
  <section id="suburbs" class="bg-white py-20 px-4 md:px-8 lg:px-12">
    <div class="max-w-5xl mx-auto">

      <div class="text-center mb-12 fade-in">
        <h2 data-i18n="suburbs-title"
          class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-3"></h2>
        <p data-i18n="suburbs-intro"
          class="text-slate-500 max-w-2xl mx-auto text-base leading-relaxed"></p>
      </div>

      <div class="grid md:grid-cols-2 gap-6 mb-6 fade-in">
        <!-- Preston -->
        <div class="border border-slate-100 rounded-2xl p-6 shadow-sm hover:shadow-md transition-shadow">
          <div class="flex items-center gap-3 mb-5">
            <div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center flex-shrink-0">
              <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </div>
            <h3 class="text-xl font-bold text-slate-900">Preston</h3>
          </div>
          <div data-i18n="suburb-preston" class="text-slate-600 text-sm leading-relaxed space-y-2"></div>
        </div>

        <!-- North Melbourne -->
        <div class="border border-slate-100 rounded-2xl p-6 shadow-sm hover:shadow-md transition-shadow">
          <div class="flex items-center gap-3 mb-5">
            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0">
              <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </div>
            <h3 class="text-xl font-bold text-slate-900">North Melbourne</h3>
          </div>
          <div data-i18n="suburb-northmelb" class="text-slate-600 text-sm leading-relaxed space-y-2"></div>
        </div>
      </div>

      <div class="bg-slate-50 rounded-2xl p-5 mb-5 fade-in">
        <p data-i18n="suburbs-also" class="text-slate-600 text-sm"></p>
      </div>

      <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-6 fade-in">
        <h4 data-i18n="suburbs-principle-title" class="font-bold text-emerald-800 mb-2 text-sm uppercase tracking-wide"></h4>
        <p data-i18n="suburbs-principle-body" class="text-emerald-700 text-sm leading-relaxed"></p>
      </div>

    </div>
  </section>

  <!-- ── SECTION 3: MARKET EXPLAINER ───── -->
  <section id="market" class="bg-slate-50 py-20 px-4 md:px-8 lg:px-12">
    <div class="max-w-3xl mx-auto">

      <div class="text-center mb-10 fade-in">
        <h2 data-i18n="market-title"
          class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-3"></h2>
        <p data-i18n="market-subtitle" class="text-slate-500"></p>
      </div>

      <div class="space-y-3 fade-in">

        <!-- 3a: Property types -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
          <button onclick="toggleAccordion('acc-1')"
            class="w-full flex items-center justify-between px-6 py-5 text-left group">
            <span data-i18n="acc1-title" class="font-semibold text-slate-900 group-hover:text-emerald-600 transition-colors"></span>
            <svg id="acc-1-icon" class="accordion-icon w-5 h-5 text-slate-400 flex-shrink-0 ml-4"
              fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div id="acc-1" class="accordion-content">
            <div data-i18n="acc1-body" class="px-6 pb-5 text-slate-600 text-sm leading-relaxed"></div>
          </div>
        </div>

        <!-- 3b: Stamp duty -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
          <button onclick="toggleAccordion('acc-2')"
            class="w-full flex items-center justify-between px-6 py-5 text-left group">
            <span data-i18n="acc2-title" class="font-semibold text-slate-900 group-hover:text-emerald-600 transition-colors"></span>
            <svg id="acc-2-icon" class="accordion-icon w-5 h-5 text-slate-400 flex-shrink-0 ml-4"
              fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div id="acc-2" class="accordion-content">
            <div data-i18n="acc2-body" class="px-6 pb-5 text-slate-600 text-sm leading-relaxed"></div>
          </div>
        </div>

        <!-- 3c: First Home Guarantee -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
          <button onclick="toggleAccordion('acc-3')"
            class="w-full flex items-center justify-between px-6 py-5 text-left group">
            <span data-i18n="acc3-title" class="font-semibold text-slate-900 group-hover:text-emerald-600 transition-colors"></span>
            <svg id="acc-3-icon" class="accordion-icon w-5 h-5 text-slate-400 flex-shrink-0 ml-4"
              fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div id="acc-3" class="accordion-content">
            <div data-i18n="acc3-body" class="px-6 pb-5 text-slate-600 text-sm leading-relaxed"></div>
          </div>
        </div>

        <!-- 3d: Offset account -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
          <button onclick="toggleAccordion('acc-4')"
            class="w-full flex items-center justify-between px-6 py-5 text-left group">
            <span data-i18n="acc4-title" class="font-semibold text-slate-900 group-hover:text-emerald-600 transition-colors"></span>
            <svg id="acc-4-icon" class="accordion-icon w-5 h-5 text-slate-400 flex-shrink-0 ml-4"
              fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div id="acc-4" class="accordion-content">
            <div data-i18n="acc4-body" class="px-6 pb-5 text-slate-600 text-sm leading-relaxed"></div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- ── SECTION 4: MONEY TRANSFER ─────── -->
  <section id="transfer" class="bg-white py-20 px-4 md:px-8 lg:px-12">
    <div class="max-w-3xl mx-auto">

      <div class="fade-in bg-amber-50 border border-amber-200 rounded-xl px-5 py-3.5 mb-10 flex items-center gap-3">
        <svg class="w-5 h-5 text-amber-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span data-i18n="transfer-banner" class="text-amber-700 text-sm font-medium"></span>
      </div>

      <div class="fade-in">
        <h2 data-i18n="transfer-title"
          class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-8"></h2>
        <div data-i18n="transfer-body"
          class="text-slate-600 leading-relaxed space-y-5 text-sm md:text-base"></div>
      </div>

    </div>
  </section>

  <!-- ── SECTION 5: PLAN + SCENARIOS ───── -->
  <section id="scenarios" class="bg-slate-50 py-20 px-4 md:px-8 lg:px-12">
    <div class="max-w-5xl mx-auto">

      <!-- Plan summary -->
      <div class="fade-in mb-14">
        <h2 data-i18n="plan-title"
          class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-8 text-center"></h2>
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 md:p-8 max-w-lg mx-auto">
          <div data-i18n="plan-body"></div>
        </div>
      </div>

      <!-- Scenario cards -->
      <div class="fade-in">
        <h3 data-i18n="scenarios-heading"
          class="text-xl font-extrabold text-slate-900 mb-6 text-center"></h3>
        <div class="grid md:grid-cols-3 gap-5">

          <div class="bg-white rounded-2xl shadow-sm border-t-4 border-red-500 overflow-hidden flex flex-col">
            <div class="bg-red-50 px-6 py-4">
              <h4 data-i18n="sc-worst-title" class="font-bold text-red-700 text-base"></h4>
            </div>
            <div data-i18n="sc-worst-body" class="px-6 py-5 text-slate-600 text-sm space-y-2 flex-1"></div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border-t-4 border-amber-500 overflow-hidden flex flex-col">
            <div class="bg-amber-50 px-6 py-4">
              <h4 data-i18n="sc-real-title" class="font-bold text-amber-700 text-base"></h4>
            </div>
            <div data-i18n="sc-real-body" class="px-6 py-5 text-slate-600 text-sm space-y-2 flex-1"></div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border-t-4 border-emerald-500 overflow-hidden flex flex-col">
            <div class="bg-emerald-50 px-6 py-4">
              <h4 data-i18n="sc-best-title" class="font-bold text-emerald-700 text-base"></h4>
            </div>
            <div data-i18n="sc-best-body" class="px-6 py-5 text-slate-600 text-sm space-y-2 flex-1"></div>
          </div>

        </div>
      </div>

    </div>
  </section>

  <!-- ── SECTION 6: CALCULATOR ──────────── -->
  <section id="calculator" class="bg-white py-20 px-4 md:px-8 lg:px-12">
    <div class="max-w-4xl mx-auto">

      <div class="text-center mb-10 fade-in">
        <h2 data-i18n="calc-title"
          class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-3"></h2>
        <p data-i18n="calc-subtitle" class="text-slate-500"></p>
      </div>

      <!-- Sliders -->
      <div class="fade-in bg-slate-50 rounded-2xl p-6 md:p-8 mb-6">
        <div class="grid md:grid-cols-2 gap-x-8 gap-y-6">

          <div>
            <div class="flex justify-between items-baseline mb-2">
              <label data-i18n="sl1-label" class="text-sm font-medium text-slate-600"></label>
              <span id="sl1-val" class="text-sm font-bold text-emerald-600 tabular-nums"></span>
            </div>
            <input type="range" id="sl1" min="50000" max="350000" step="10000" value="200000" oninput="updateCalc()">
          </div>

          <div>
            <div class="flex justify-between items-baseline mb-2">
              <label data-i18n="sl2-label" class="text-sm font-medium text-slate-600"></label>
              <span id="sl2-val" class="text-sm font-bold text-emerald-600 tabular-nums"></span>
            </div>
            <input type="range" id="sl2" min="2" max="10" step="0.5" value="5" oninput="updateCalc()">
          </div>

          <div>
            <div class="flex justify-between items-baseline mb-2">
              <label data-i18n="sl3-label" class="text-sm font-medium text-slate-600"></label>
              <span id="sl3-val" class="text-sm font-bold text-emerald-600 tabular-nums"></span>
            </div>
            <input type="range" id="sl3" min="300000" max="600000" step="10000" value="450000" oninput="updateCalc()">
          </div>

          <div>
            <div class="flex justify-between items-baseline mb-2">
              <label data-i18n="sl4-label" class="text-sm font-medium text-slate-600"></label>
              <span id="sl4-val" class="text-sm font-bold text-emerald-600 tabular-nums"></span>
            </div>
            <input type="range" id="sl4" min="20000" max="80000" step="5000" value="50000" oninput="updateCalc()">
          </div>

          <div>
            <div class="flex justify-between items-baseline mb-2">
              <label data-i18n="sl5-label" class="text-sm font-medium text-slate-600"></label>
              <span id="sl5-val" class="text-sm font-bold text-emerald-600 tabular-nums"></span>
            </div>
            <input type="range" id="sl5" min="4.0" max="8.0" step="0.1" value="6.0" oninput="updateCalc()">
          </div>

          <div>
            <div class="flex justify-between items-baseline mb-2">
              <label data-i18n="sl6-label" class="text-sm font-medium text-slate-600"></label>
              <span id="sl6-val" class="text-sm font-bold text-emerald-600 tabular-nums"></span>
            </div>
            <input type="range" id="sl6" min="5" max="30" step="1" value="15" oninput="updateCalc()">
          </div>

          <div class="md:col-span-2">
            <div class="flex justify-between items-baseline mb-2">
              <label data-i18n="sl7-label" class="text-sm font-medium text-slate-600"></label>
              <span id="sl7-val" class="text-sm font-bold text-emerald-600 tabular-nums"></span>
            </div>
            <input type="range" id="sl7" min="0" max="150000" step="5000" value="0" oninput="updateCalc()">
          </div>

        </div>
      </div>

      <!-- Output metrics grid -->
      <div class="fade-in grid grid-cols-2 md:grid-cols-3 gap-3 mb-5">

        <div class="bg-slate-50 rounded-xl p-4">
          <p data-i18n="out1-label" class="text-xs text-slate-400 mb-1 leading-tight"></p>
          <p id="out1" class="text-base font-bold text-red-500 tabular-nums"></p>
        </div>
        <div class="bg-slate-50 rounded-xl p-4">
          <p data-i18n="out2-label" class="text-xs text-slate-400 mb-1 leading-tight"></p>
          <p id="out2" class="text-base font-bold text-slate-800 tabular-nums"></p>
        </div>
        <div class="bg-slate-50 rounded-xl p-4">
          <p data-i18n="out3-label" class="text-xs text-slate-400 mb-1 leading-tight"></p>
          <p id="out3" class="text-base font-bold text-slate-800 tabular-nums"></p>
        </div>
        <div class="bg-slate-50 rounded-xl p-4">
          <p data-i18n="out4-label" class="text-xs text-slate-400 mb-1 leading-tight"></p>
          <p id="out4" class="text-base font-bold text-slate-800 tabular-nums"></p>
        </div>
        <div class="bg-slate-50 rounded-xl p-4">
          <p data-i18n="out5-label" class="text-xs text-slate-400 mb-1 leading-tight"></p>
          <p id="out5" class="text-base font-bold text-slate-800 tabular-nums"></p>
        </div>
        <div class="bg-slate-50 rounded-xl p-4">
          <p data-i18n="out6-label" class="text-xs text-slate-400 mb-1 leading-tight"></p>
          <p id="out6" class="text-base font-bold text-emerald-600 tabular-nums"></p>
        </div>
        <div class="bg-slate-50 rounded-xl p-4">
          <p data-i18n="out7-label" class="text-xs text-slate-400 mb-1 leading-tight"></p>
          <p id="out7" class="text-base font-bold text-slate-800 tabular-nums"></p>
        </div>
        <div class="bg-slate-50 rounded-xl p-4 col-span-1">
          <p data-i18n="out8-label" class="text-xs text-slate-400 mb-1 leading-tight"></p>
          <p id="out8" class="text-xl font-extrabold tabular-nums"></p>
        </div>
        <div class="bg-slate-50 rounded-xl p-4 col-span-1">
          <p data-i18n="out9-label" class="text-xs text-slate-400 mb-1 leading-tight"></p>
          <p id="out9" class="text-xl font-extrabold tabular-nums"></p>
        </div>

      </div>

      <!-- Verdict -->
      <div class="fade-in rounded-2xl p-6 text-center border-l-4 bg-slate-50 border-slate-300" id="verdict-box">
        <p id="verdict-text" class="font-semibold text-lg text-slate-700"></p>
      </div>

    </div>
  </section>

  <!-- ── SECTION 7: TIMELINE ────────────── -->
  <section id="timeline" class="bg-slate-50 py-20 px-4 md:px-8 lg:px-12">

// ══════════════════════════════════════════════════════════
// LANGUAGE SYSTEM
// ══════════════════════════════════════════════════════════

let currentLang = 'ru';

function setLang(lang) {
  currentLang = lang;
  const active   = 'px-3 py-1.5 rounded-full text-sm font-bold transition-all bg-emerald-500 text-white';
  const inactive = 'px-3 py-1.5 rounded-full text-sm font-bold transition-all text-slate-500 hover:text-slate-800';
  document.getElementById('btn-ru').className = lang === 'ru' ? active : inactive;
  document.getElementById('btn-en').className = lang === 'en' ? active : inactive;
  applyLang(lang);
  buildTimeline(lang);
  updateCalc();
}

function applyLang(lang) {
  const t = i18n[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (key && typeof t[key] === 'string') {
      el.innerHTML = t[key];
    }
  });
}

// ══════════════════════════════════════════════════════════
// PASSWORD
// ══════════════════════════════════════════════════════════

// SHA-256 of "melbourne2026"
const CORRECT_HASH = '9aa47eb34525820a8976c90eb2e2ae261cdfb0e1a58be5dbc146414500adfdc4';

async function sha256(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword() {
  const val = document.getElementById('pwd-input').value;
  const hash = await sha256(val);
  if (hash === CORRECT_HASH) {
    sessionStorage.setItem('auth', '1');
    document.getElementById('pwd-overlay').style.display = 'none';
    document.getElementById('main').classList.remove('hidden');
    buildTimeline(currentLang);
    updateCalc();
    setTimeout(initObserver, 120);
  } else {
    const errEl  = document.getElementById('pwd-error');
    const inputEl = document.getElementById('pwd-input');
    errEl.classList.remove('hidden');
    inputEl.classList.add('ring-2', 'ring-red-300', 'border-red-300');
    setTimeout(() => {
      errEl.classList.add('hidden');
      inputEl.classList.remove('ring-2', 'ring-red-300', 'border-red-300');
    }, 3000);
  }
}

document.getElementById('pwd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPassword();
});

// ══════════════════════════════════════════════════════════
// ACCORDION
// ══════════════════════════════════════════════════════════

function toggleAccordion(id) {
  const content = document.getElementById(id);
  const icon    = document.getElementById(id + '-icon');
  const isOpen  = content.classList.contains('open');

  document.querySelectorAll('.accordion-content').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.accordion-icon').forEach(el => el.classList.remove('rotated'));

  if (!isOpen) {
    content.classList.add('open');
    icon.classList.add('rotated');
  }
}

function buildTimeline(lang) {
  const items     = i18n[lang]['timeline-items'];
  const container = document.getElementById('timeline-items');
  if (!container) return;
  container.innerHTML = '';
  items.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'relative pl-14';
    div.innerHTML = `
      <div class="absolute left-0 top-1 w-10 h-10 rounded-full ${item.color} flex items-center justify-center
                  text-white font-bold text-sm shadow-md ring-4 ring-white">
        ${idx + 1}
      </div>
      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
        <span class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">${item.period}</span>
        <h4 class="font-bold text-slate-900 text-base mt-1 mb-3">${item.title}</h4>
        <ul class="space-y-2">
          ${item.items.map(t => `
            <li class="flex items-start gap-2 text-sm text-slate-600">
              <span class="text-emerald-500 mt-0.5 flex-shrink-0 font-bold">✓</span>
              <span>${t}</span>
            </li>`).join('')}
        </ul>
      </div>`;
    container.appendChild(div);
  });
}

// ══════════════════════════════════════════════════════════
// CALCULATOR
// ══════════════════════════════════════════════════════════

function fmt(n) {
  return '$' + Math.round(n).toLocaleString('en-AU');
}

function fmtRub(n) {
  const sign = n >= 0 ? '+' : '−';
  return sign + Math.abs(Math.round(n)).toLocaleString('en-AU') + ' ₽';
}

function fmtFlow(n) {
  const sign = n >= 0 ? '+' : '−';
  return sign + '$' + Math.abs(Math.round(n)).toLocaleString('en-AU');
}

function calcMonthly(principal, annualRatePct, years) {
  if (principal <= 0) return 0;
  const r = annualRatePct / 100 / 12;
  const n = years * 12;
  if (r === 0) return principal / n;
  return principal * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
}

function updateCalc() {
  const parents  = +document.getElementById('sl1').value;
  const feePct   = +document.getElementById('sl2').value;
  const price    = +document.getElementById('sl3').value;
  const savings  = +document.getElementById('sl4').value;
  const rate     = +document.getElementById('sl5').value;
  const years    = +document.getElementById('sl6').value;
  const offset   = +document.getElementById('sl7').value;

  const t = i18n[currentLang];

  // Slider display values
  document.getElementById('sl1-val').textContent = fmt(parents);
  document.getElementById('sl2-val').textContent = feePct.toFixed(1) + '%';
  document.getElementById('sl3-val').textContent = fmt(price);
  document.getElementById('sl4-val').textContent = fmt(savings);
  document.getElementById('sl5-val').textContent = rate.toFixed(1) + '%';
  document.getElementById('sl6-val').textContent = years + t['sl6-unit'];
  document.getElementById('sl7-val').textContent = fmt(offset);

  // Computations
  const fee             = parents * feePct / 100;
  const netDeposit      = Math.max(0, (parents - fee) + savings - 4000);
  const mortgage        = Math.max(0, price - netDeposit);
  const effectiveMort   = Math.max(0, mortgage - offset);
  const repayment       = calcMonthly(effectiveMort, rate, years);
  const estimatedRent   = price * 0.038 / 12;
  const propMgmt        = estimatedRent * 0.08;
  const expenses        = repayment + 550 + propMgmt;
  const cashFlow        = estimatedRent - expenses;
  const cashFlowRub     = cashFlow * 55;

  // Output values
  document.getElementById('out1').textContent = fmt(fee);
  document.getElementById('out2').textContent = fmt(netDeposit);
  document.getElementById('out3').textContent = fmt(mortgage);
  document.getElementById('out4').textContent = fmt(effectiveMort);
  document.getElementById('out5').textContent = fmt(repayment);
  document.getElementById('out6').textContent = fmt(estimatedRent);
  document.getElementById('out7').textContent = fmt(expenses);

  const flowEl = document.getElementById('out8');
  const rubEl  = document.getElementById('out9');
  flowEl.textContent = fmtFlow(cashFlow);
  rubEl.textContent  = fmtRub(cashFlowRub);

  // Color cash flow outputs
  let colorClass, borderClass, textClass, verdictKey;
  if (cashFlow > 100) {
    colorClass  = 'text-emerald-600';
    borderClass = 'border-emerald-500';
    textClass   = 'text-emerald-700';
    verdictKey  = 'verdict-great';
  } else if (cashFlow >= -200) {
    colorClass  = 'text-amber-500';
    borderClass = 'border-amber-400';
    textClass   = 'text-amber-700';
    verdictKey  = 'verdict-ok';
  } else if (cashFlow >= -800) {
    colorClass  = 'text-amber-600';
    borderClass = 'border-amber-400';
    textClass   = 'text-amber-700';
    verdictKey  = 'verdict-manageable';
  } else {
    colorClass  = 'text-red-500';
    borderClass = 'border-red-500';
    textClass   = 'text-red-700';
    verdictKey  = 'verdict-bad';
  }

  flowEl.className = `text-xl font-extrabold tabular-nums ${colorClass}`;
  rubEl.className  = `text-xl font-extrabold tabular-nums ${colorClass}`;

  const verdictBox  = document.getElementById('verdict-box');
  const verdictText = document.getElementById('verdict-text');
  verdictBox.className  = `rounded-2xl p-6 text-center border-l-4 bg-slate-50 ${borderClass}`;
  verdictText.className = `font-semibold text-lg ${textClass}`;
  verdictText.textContent = t[verdictKey];
}

// ══════════════════════════════════════════════════════════
// INTERSECTION OBSERVER
// ══════════════════════════════════════════════════════════

function initObserver() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08 });
  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
}
